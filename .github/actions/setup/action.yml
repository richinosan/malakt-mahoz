name: setup
description: ビルドに必要な OS のライブラリと、mise で管理しているツールを入れる
runs:
  using: composite
  steps:
    - name: Linux のライブラリを入れる
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          clang pkg-config libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev \
          libwayland-dev libvulkan-dev libfontconfig-dev libfreetype-dev \
          libssl-dev libasound2-dev libzstd-dev libwebkit2gtk-4.1-dev libgtk-3-dev
    - uses: jdx/mise-action@v2
    - name: rustfmt と clippy を入れる
      shell: bash
      run: mise exec -- rustup component add rustfmt clippy
    # テストが落ちたときもビルドしたものを残す。残さないと、次も依存クレートを全部ビルドし直す
    - uses: Swatinem/rust-cache@v2
      with:
        cache-on-failure: true
