name: AI シナリオテスト（週 1 回）

on:
  schedule:
    # 毎週木曜 03:00（日本時間）
    - cron: "0 18 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  scenario:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: 既存のシナリオテストを実行する
        run: mise run test
      - name: 新しいシナリオを探して試す
        if: env.ANTHROPIC_API_KEY != ''
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ format('{0}/.github/prompts/scenario.md の指示に従ってください。', github.workspace) }}
          claude_args: --model claude-haiku-5-5 --max-turns 80
