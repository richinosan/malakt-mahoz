name: リリース

# main の Cargo.toml のバージョンに対応するタグがまだなければ、ビルドして公開する。

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: 公開するか決める
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(awk '
            /^\[/ { section = $0 }
            section == "[workspace.package]" && /^version = / { gsub(/"/, "", $3); print $3 }
          ' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "v$version は公開済みです。何もしません。"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: ビルド（${{ matrix.name }}）
    needs: check
    if: needs.check.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    # ふだんは 20 分ほど（リリースビルドは lto と codegen-units = 1 で遅い）
    timeout-minutes: 40
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64 }
          - { os: macos-latest, name: macos-aarch64 }
          - { os: windows-latest, name: windows-x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: mise run test
      - run: mise run build
      - name: まとめる
        shell: bash
        env:
          VERSION: ${{ needs.check.outputs.version }}
          NAME: ${{ matrix.name }}
        run: |
          bin=target/release/malakt-mahoz
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
          scripts/package.sh "$VERSION" "$NAME" "$bin"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: 公開する
    needs: [check, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          (cd dist && sha256sum * > SHA256SUMS)
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
