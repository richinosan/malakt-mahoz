name: CI

# プルリクエストでは動かさない。コミットの前の確認は pre-commit フック（mise run hooks）で行い、
# ここでは main に入ったものを 3 つの OS で確かめる。
on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # タイムアウトは、ふだんかかる時間（キャッシュが冷えたときを含む）の 1.5〜2 倍にしている。
  # 止まったテストで何十分も回り続けないようにする
  lint:
    name: 書式と clippy
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: mise run lint
      - run: mise run api-check

  test:
    name: テスト（${{ matrix.os }}）
    runs-on: ${{ matrix.os }}
    # ふだんは 4〜5 分、キャッシュが冷えた macOS で 9 分ほど
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-x86_64 }
          - { os: macos-latest, name: macos-aarch64 }
          - { os: windows-latest, name: windows-x86_64 }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # ユニットテストと、core・画面のシナリオテストをまとめて実行する。
      # 全ボタンを押すテストは重いので外している（mise run test-buttons）
      - run: mise run test
      # 配布用のアーカイブを組み立てられることを確かめる。中身は、テストのときにできたデバッグビルド。
      # cargo build し直すと、テスト用の機能を外した gpui を全部ビルドし直すことになる
      - name: 配布物を組み立てる
        shell: bash
        env:
          NAME: ${{ matrix.name }}
        run: |
          bin=target/debug/malakt-mahoz
          if [ "$RUNNER_OS" = "Windows" ]; then bin="$bin.exe"; fi
          scripts/package.sh 0.0.0 "$NAME" "$bin"

  bench:
    name: ベンチマーク
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: cargo bench -p malakt-core --locked -- --warm-up-time 1 --measurement-time 2 | tee bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench.txt
