# 見本のプラグイン。アプリのワークスペースには入れない（WASM 向けに別にビルドする）。
# ビルド: mise run plugin-example
[package]
name = "task-markdown"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.4.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
