[package]
name = "malakt-mahoz"
description = "オフラインのタスク管理ツール"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "malakt_mahoz"
path = "src/lib.rs"

[[bin]]
name = "malakt-mahoz"
path = "src/main.rs"

[dependencies]
malakt-core.workspace = true
gpui-kit = "0.11.0"
dirs = "5"
malakt-ai.workspace = true
malakt-passkey.workspace = true
malakt-reminders.workspace = true
malakt-update.workspace = true
malakt-term.workspace = true
raw-window-handle = "0.6"
async-channel = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
serde.workspace = true
serde_json.workspace = true
flate2 = "1"
resvg = { version = "0.45", default-features = false }
# アプリ内ブラウザ。OS のブラウザの部品（Windows は WebView2、macOS は WKWebView、Linux は WebKitGTK）を使う
wry = "0.58"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
gpui-kit = { version = "0.11.0", features = ["test-support"] }
tempfile = "3"

# Linux の WebKitGTK は GTK の上で動く
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.19"
webkit2gtk = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# メニューの後ろに出す、ページの画像を撮る
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSError", "NSString"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration"] }

# メニューの後ろに出す、ページの画像を撮る
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
