[package]
name = "malakt-mahoz"
description = "オフラインのタスク管理ツール"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "malakt_mahoz"
path = "src/lib.rs"

[[bin]]
name = "malakt-mahoz"
path = "src/main.rs"

[dependencies]
malakt-core.workspace = true
gpui-kit = "0.11.0"
dirs = "5"
malakt-ai.workspace = true
malakt-passkey.workspace = true
malakt-reminders.workspace = true
malakt-update.workspace = true
malakt-term.workspace = true
malakt-autostart.workspace = true
malakt-caldav.workspace = true
keyring = "4"
malakt-media.workspace = true
malakt-plugins.workspace = true
raw-window-handle = "0.6"
async-channel = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff"] }
serde.workspace = true
serde_json.workspace = true
flate2 = "1"
resvg = { version = "0.45", default-features = false }
# アプリ内ブラウザ。OS のブラウザの部品（Windows は WebView2、macOS は WKWebView、Linux は WebKitGTK）を使う
wry = "0.58"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# 保存した PDF のページを選び、フォントを埋め込んでいるかを確かめる
lopdf = { version = "0.47", default-features = false }
# MCP の HTTP（127.0.0.1 だけ）で、リクエストの頭を読む
httparse = "1"

[dev-dependencies]
gpui-kit = { version = "0.11.0", features = ["test-support"] }
tempfile = "3"

# Linux の WebKitGTK は GTK の上で動く
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.19"
webkit2gtk = "3"
# ウィンドウを最前面に表示するときに、ウィンドウマネージャーに頼む（X11）
x11rb = "0.13"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# メニューの後ろに出す、ページの画像を撮る
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSImage", "NSPrintInfo", "NSPrintOperation", "NSView", "NSWindow", "NSResponder", "NSGraphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSError", "NSString", "NSURL", "NSDictionary", "NSValue", "NSGeometry", "NSObject", "NSThread"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKWebView", "WKSnapshotConfiguration", "WKPDFConfiguration", "WKPreferences", "WKWebViewConfiguration"] }

# メニューの後ろに出す、ページの画像を撮る
[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
