[package]
name = "malakt-mahoz"
description = "オフラインのタスク管理ツール"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "malakt_mahoz"
path = "src/lib.rs"

[[bin]]
name = "malakt-mahoz"
path = "src/main.rs"

[dependencies]
malakt-core.workspace = true
gpui-kit = "0.11.0"
dirs = "5"
malakt-ai.workspace = true
malakt-passkey.workspace = true
malakt-reminders.workspace = true
raw-window-handle = "0.6"
async-channel = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
gpui-kit = { version = "0.11.0", features = ["test-support"] }
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"
