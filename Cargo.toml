[workspace]
resolver = "2"
members = ["crates/core", "crates/ai", "crates/app", "crates/passkey", "crates/reminders", "crates/update", "crates/term", "crates/autostart", "crates/caldav", "crates/media"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/richinosan/malakt-mahoz"

[workspace.dependencies]
malakt-core = { path = "crates/core" }
malakt-ai = { path = "crates/ai" }
malakt-passkey = { path = "crates/passkey" }
malakt-reminders = { path = "crates/reminders" }
malakt-update = { path = "crates/update" }
malakt-term = { path = "crates/term" }
malakt-autostart = { path = "crates/autostart" }
malakt-caldav = { path = "crates/caldav" }
malakt-media = { path = "crates/media" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# 開発用のビルドがディスクを食わないよう、デバッグ情報は行番号だけにし、
# 依存クレートの分は付けない（バックトレースの行番号は出る）
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
