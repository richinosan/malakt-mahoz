[tools]
rust = { version = "1.100.0", components = "rustfmt,clippy" }
# API の定義（api/*.tsp）からツールの一覧を作るときだけ使う。アプリのビルドには要らない
node = "26.13.1"

[tasks.dev]
description = "開発用にアプリを起動する（デバッグビルド）"
run = "cargo run -p malakt-mahoz"

[tasks.start]
description = "アプリを起動する（リリースビルド）"
run = "cargo run --release -p malakt-mahoz"

[tasks.build]
description = "リリース用にビルドする。成果物は target/release/malakt-mahoz"
run = "cargo build --release --locked -p malakt-mahoz"

[tasks.test]
description = "ユニットテストとシナリオテストをすべて実行する"
# 1 つのファイルで落ちても、残りのファイルのテストも走らせる。CI の 1 回で、その OS で落ちるものが全部わかる
run = "cargo test --workspace --locked --no-fail-fast"

[tasks.test-buttons]
description = "画面のボタンを全部押して、押したら何かが変わることを確かめる（重いので手で回す）"
run = "cargo test --locked -p malakt-mahoz --test buttons -- --ignored"

[tasks.cache-check]
description = "本物の Claude API に 2 回送り、プロンプトキャッシュが効いているかを確かめる（ANTHROPIC_API_KEY が要る。少しお金がかかる）"
run = "cargo test --locked -p malakt-ai --test cache_live -- --ignored --nocapture"

[tasks.lint]
description = "書式と clippy を確かめる"
run = [
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
]

[tasks.api]
description = "API の定義（api/*.tsp）から、ツールの一覧 api/generated/tools.json を作り直す"
dir = "api"
run = ["npm install --prefer-offline --no-audit --no-fund --silent", "node build.mjs"]

[tasks.api-check]
description = "api/generated/tools.json が API の定義（api/*.tsp）と合っているかを確かめる"
dir = "api"
run = ["npm install --prefer-offline --no-audit --no-fund --silent", "node build.mjs --check"]

[tasks.plugin-example]
description = "見本のプラグイン（examples/plugins/task-markdown）を WASM にビルドして plugin.wasm を作り直す"
dir = "examples/plugins/task-markdown"
run = [
  "rustup target add wasm32-unknown-unknown",
  "cargo build --release --locked --target wasm32-unknown-unknown",
  "node -e \"require('fs').copyFileSync('target/wasm32-unknown-unknown/release/task_markdown.wasm', 'plugin.wasm')\"",
]

[tasks.verify]
description = "コミットの前の確認（書式、clippy、API の定義、テスト）。pre-commit フックが実行する"
depends = ["lint", "api-check"]
run = "cargo test --workspace --locked"

[tasks.hooks]
description = "コミットの前に verify を実行するフックを、このリポジトリに入れる"
run = "git config core.hooksPath .githooks"

[tasks.fmt]
description = "書式をそろえる"
run = "cargo fmt --all"

[tasks.bench]
description = "core のベンチマークを実行する"
run = "cargo bench -p malakt-core"

[tasks.mutants]
description = "core のミューテーションテストを実行する（cargo-mutants が必要）"
run = "cargo mutants -p malakt-core --no-shuffle"
